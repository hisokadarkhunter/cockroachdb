---
- name: Get installation files
  get_url: url="{{ binary_url }}/{{ cockroach_binaries.filename }}" dest="{{ install_stage}}/{{ cockroach_binaries.filename }}" validate_certs=false
  when: download_binaries
  tags: download

- name: Unpack/install binaries
  unarchive: src="{{ install_stage}}/{{ cockroach_binaries.filename }}" dest={{ install_location }} extra_opts="--strip-components=1" copy=no owner={{ cockroach_user }} group={{ cockroach_group }}
  tags: install,unpack

- name: Push CA key/cert
  copy: src={{ item.name }} dest={{ item.dest }} owner={{ cockroach_user }} group={{ cockroach_group }} mode={{ item.mode }}
  with_items:
      - "{{ ca_files }}"
  tags: ca_cert

- name: Create node keys
  shell: "{{ install_location }}/cockroach cert create-node {{ ansible_hostname }} {{ ansible_fqdn }} localhost --certs-dir={{ certs_dir }}/ --ca-key={{ca_dir}}/ca.key --overwrite"
  become_user: "{{ cockroach_user}}"
  args:
     creates: "{{ certs_dir}}/node.crt"
  tags: node_cert

- name: Create user cert
  shell: "{{ install_location }}/cockroach cert create-client  --certs-dir={{ certs_dir }}/ --ca-key={{ca_dir}}/ca.key {{ item }}"
  with_items:
      - "{{ cert_users }}"
  become_user: "{{ cockroach_user }}"
  args:
     creates: "{{ certs_dir}}/client.{{ item }}.crt"
  tags: node_cert

- name: List certs
  shell: "{{ install_location }}/cockroach cert list --certs-dir={{ certs_dir }}"
  become_user: "{{ cockroach_user }}"
  tags: node_cert, check_node_cert
  register: node_cert

- debug: var=node_cert.stdout_lines
  tags: node_cert,check_node_cert


- name: create symlink to /usr/local/bin
  file: src={{ install_location }}/cockroach dest=/usr/local/bin/cockroach state=link
  tags: link

- name: test the installation
  shell: "{{ install_location }}/cockroach version"
  register: cversion
  failed_when:
        - not cversion.stdout |search ('v'~install_version )
  tags: test_install

- name: print output
  debug: var=cversion.stdout_lines
  tags: test_install